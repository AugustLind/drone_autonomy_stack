services:
  sim:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      LOCAL_VIDEO_GID: ${LOCAL_VIDEO_GID:-44}
      LOCAL_RENDER_GID: ${LOCAL_RENDER_GID:-109}
    group_add:
      - ${LOCAL_VIDEO_GID:-44}
      - ${LOCAL_RENDER_GID:-109}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1
