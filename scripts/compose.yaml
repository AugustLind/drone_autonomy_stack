services:
  sim:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    image: sim_image:dev
    container_name: sim_container
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: xcb 
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - px4-build:/opt/PX4-Autopilot/build
    stdin_open: true
    tty: true
    command: sleep infinity

volumes:
  px4-build:
